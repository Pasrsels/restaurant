{% extends "base.html" %}
{% load static %}
{% block title %}Add Module{% endblock title %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow p-3">
        <h4 class="border-bottom pb-2">Add New Module</h4>

        <form method="post">
            {% csrf_token %}
            <div class="form-group mt-3">
                <label for="module_name">Module Name</label>
                <input type="text" id="module_name" name="name" class="form-control" placeholder="e.g. Inventory">
            </div>
            <div class="d-flex justify-content-end mt-3">
                <button type="submit" class="btn btn-primary">Add Module</button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
