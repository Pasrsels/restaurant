{% load static %}
{% block content %}
    <style>
        .sidebar {
            margin-top: 50px;
            height: 100vh;
            position: fixed;
            width: 300px;
            flex-direction: column;
            padding-top: 20px;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .sidebar .card {
            border: border;
            padding: 2px;
            background: transparent;
            transition: background 0.3s, color 0.3s;
            width: 280px;
            margin-left: 5px;
        }

        .sidebar .card-body{
            display: flex;
            justify-content: center;
            align-items: center;
            padding-left: 10px;
            height: 3rem;
        }

        .sidebar .card:hover {
            background: #333;
            color: white;
        }
        .sidebar .card img {
            margin-right: 15px;
        }

        .sidebar a {
            text-decoration: none;
            color: inherit;
            margin-bottom: 10px;
        }

        .content {
            margin-left: 270px; 
            padding: 20px;
        }
    </style>

    <div class="Meal_Categories">
        <div class="d-flex justify-content-between text-dark rounded mt-4 align-items-center">
            <a href='/' class='mt-1 bx bx-home btn border fs-5'></a>
            <span class='fs-5 fw-bold mx-3'>Meal Categories</span>
        </div>
    </div>        

    <!-- Sidebar Container -->
    <div class="sidebar"></div>

<script>
    //function to populate sidebar
    function populateSidebarCategories() {
        fetch("{% url 'inventory:create_meal_category' %}", {
            method: 'GET'
        })
        .then(response => response.json())
        .then(data => {
            console.log({ category_list_meal: data.meal, category_list_product: data.product });
            const sidebarContainer = document.querySelector('.sidebar');
            sidebarContainer.innerHTML = '';
            
            // Add CSS for bordered and centered list items
            const style = document.createElement('style');
            style.textContent = `
                .sidebar .card {
                    border: 1px solid #ccc;
                    border-radius: 5px;
                    margin-bottom: 10px;
                    text-decoration: none;
                    color: inherit;
                    display: block;
                    transition: all 0.3s ease;
                    height: 50px;
                }
                .sidebar .card:hover {
                    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                }
                .sidebar .card-body {
                    padding: 12px;
                    text-align: center;
                    font-weight: 500;
                }
            `;
            document.head.appendChild(style);
            
            // Create meal category cards
            data.meal.forEach(category => {
                const link = document.createElement('a');
                link.href = "#";
                link.classList.add('card');
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    filterItemsByCategory(category.name);
                });
                
                const cardBody = document.createElement('div');
                cardBody.classList.add('card-body');
                cardBody.textContent = category.name;
                
                link.appendChild(cardBody);
                sidebarContainer.appendChild(link);
            });
            
            // Create product category cards
            data.product.forEach(category => {
                const link = document.createElement('a');
                link.href = "#";
                link.classList.add('card');
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    filterItemsByCategory(category.category__name);
                });
                
                const cardBody = document.createElement('div');
                cardBody.classList.add('card-body');
                cardBody.textContent = category.category__name;
                
                link.appendChild(cardBody);
                sidebarContainer.appendChild(link);
            });
        })
        .catch(error => console.error('Error populating sidebar:', error));
    }

    document.addEventListener('DOMContentLoaded', function() {
        populateSidebarCategories();
    });
</script>
{% endblock %}
