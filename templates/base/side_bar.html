{% load static %}
{% block content %}
<style>
    /* Sidebar Container */
    .sidebar {
        height: 100vh;
        position: fixed;
        width: 260px;
        {% comment %} background: #4F46E5; /* Deep blue background */ {% endcomment %}
        {% comment %} color: #fff; {% endcomment %}
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: width 0.3s ease;
        overflow: hidden;
        border-radius: 0 20px 20px 0;
    }

    /* Collapsed Sidebar */
    .sidebar.collapsed {
        width: 80px;
    }

    /* Top Section */
    .sidebar-header {
        padding: 20px;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Menu Section */
    .sidebar-menu {
        flex: 1;
        padding: 10px 0;
    }

    .sidebar-menu a {
        display: flex;
        align-items: center;
        padding: 12px 20px;
        {% comment %} color: #fff; {% endcomment %}
        text-decoration: none;
        font-size: 15px;
        transition: background 0.3s, padding 0.3s;
    }

    /* Active & Hover States */
    .sidebar-menu a:hover,
    .sidebar-menu a.active {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 8px;
    }

    /* Icons */
    .sidebar-menu img {
        width: 24px;
        height: 24px;
        margin-right: 15px;
        transition: margin 0.3s;
    }

    /* Collapsed: Hide text and adjust icons */
    .sidebar.collapsed .sidebar-menu a span {
        display: none;
    }

    .sidebar.collapsed .sidebar-menu img {
        margin: 0 auto;
    }

    /* Profile Section */
    .sidebar-footer {
        padding: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .sidebar-footer img {
        border-radius: 50%;
        width: 40px;
        height: 40px;
    }

    .sidebar-footer .profile-info {
        margin-left: 10px;
    }

    .sidebar-footer .profile-info span {
        display: block;
        font-size: 14px;
    }

    /* Collapsed Footer */
    .sidebar.collapsed .sidebar-footer .profile-info {
        display: none;
    }

    /* Toggle Button */
    .toggle-btn {
        position: absolute;
        top: 15px;
        right: -15px;
        background: #4F46E5;
        color: white;
        border: none;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .sidebar.collapsed ~ .content {
        margin-left: 80px;
    }
</style>

<div class="sidebar border" id="sidebar"
    <!-- Menu Items -->
    <div class="sidebar-menu">
        <a href="{% url 'pos:pos' %}" class="{% if request.resolver_match.url_name == 'pos' %}active{% endif %}">
            <img src="{% static 'assets/pngs/sell.png'%}" alt="POS">
            <span>Point Of Sale</span>
        </a>

        <a href="{% url 'analytics_index' %}" class="{% if request.resolver_match.url_name == 'analytics_index' %}active{% endif %}">
            <img src="{% static 'assets/pngs/dashboard.png'%}" alt="Analytics">
            <span>Analytics</span>
        </a>

        <a href="{% url 'inventory:products' %}" class="{% if request.resolver_match.url_name == 'products' %}active{% endif %}">
            <img src="{% static 'assets/pngs/product.png'%}" alt="Inventory">
            <span>Inventory</span>
        </a>

        <a href="{% url 'inventory:production_plans' %}" class="{% if request.resolver_match.url_name == 'production_plans' %}active{% endif %}">
            <img src="{% static 'assets/pngs/plan.png'%}" alt="Production">
            <span>Production</span>
        </a>

        <a href="{% url 'inventory:transfers' %}" class="{% if request.resolver_match.url_name == 'transfers' %}active{% endif %}">
            <img src="{% static 'assets/pngs/settings.png'%}" alt="Transfers">
            <span>Transfers</span>
        </a>

        <a href="{% url 'finance:finance' %}" class="{% if request.resolver_match.url_name == 'finance' %}active{% endif %}">
            <img src="{% static 'assets/pngs/bars.png'%}" alt="Finance">
            <span>Finance</span>
        </a>

        <a href="{% url 'users:users' %}" class="{% if request.resolver_match.url_name == 'users' %}active{% endif %}">
            <img src="{% static 'assets/pngs/users.png'%}" alt="Users">
            <span>Users</span>
        </a>

        <a href="{% url 'finance:logs' %}" class="{% if request.resolver_match.url_name == 'logs' %}active{% endif %}">
            <img src="{% static 'assets/pngs/log.png'%}" alt="Logs">
            <span>Transaction Logs</span>
        </a>

        <a href="{% url 'settings:settings' %}" class="{% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
            <img src="{% static 'assets/pngs/settings.png'%}" alt="Settings">
            <span>Settings</span>
        </a>
    </div>

    <div class="sidebar-footer">
        <img src="{% static 'assets/pngs/user_avatar.png' %}" alt="Profile">
        <div class="profile-info">
            <span>{{ request.user.first_name }} {{ request.user.last_name }}</span>
            <small>{{ request.user.email }}</small>
        </div>
    </div>
</div>
<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('collapsed');
    }
</script>
{% endblock content %}
