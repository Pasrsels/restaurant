{% extends "base.html" %}
{% load static %}
{% block title %}Dashboard{% endblock title %}
{% block content %}
<style>
    .card{
        border: none;
    }
    a{
        text-decoration: none;
    }
    .card:hover{
        background: #333;
        color:white;
    }
    #sales-dashboard {
        margin: 20px 0;
        padding: 20px;
        background-color: #f8f9fa;
        border-radius: 8px;
        text-align: center;
    }
    #total-sales {
        font-size: 2.5rem;
        font-weight: bold;
        color: #28a745;
    }
</style>

<div class="container">
    <div id="sales-dashboard" class="mb-4">
        <h3>Total Sales</h3>
        <div id="total-sales">$0.00</div>
    </div>
    <div class="row mx-3 mt-3 align-items-center" style="height: 60vh;">
        <a href="{% url 'pos:pos'%}" class="col-12 col-md-4 mb-2">
            <div class="card">
                <div class="card-body d-flex justify-content-center align-items-center flex-column">
                    <div>
                        <img src="{% static 'assets/pngs/sell.png'%}" alt="sell_icon" width="100rem">
                    </div>
                    <p class="mt-1">Point Of Sale</p>
                </div>
            </div>
        </a>
        <a href="{% url 'analytics_index' %}" class="col-12 col-md-4 mb-2">
            <div class="card">
                <div class="card-body d-flex justify-content-center align-items-center flex-column">
                    <div>
                        <img src="{% static 'assets/pngs/dashboard.png'%}" alt="dashboard_icon" width="100rem">
                    </div>
                    <p class="mt-1">Analytics</p>
                </div>
            </div>
        </a>
        <a href="{% url 'inventory:products' %}" class="col-12 col-md-4 mb-2">
            <div class="card">
                <div class="card-body d-flex justify-content-center align-items-center flex-column">
                    <div>
                        <img src="{% static 'assets/pngs/product.png'%}" alt="product_icon" width="100rem">
                    </div>
                    <p class="mt-1">Products</p>
                </div>
            </div>
        </a>
        <a href="{% url 'inventory:production_plans' %}" class="col-12 col-md-4 mb-2">
            <div class="card">
                <div class="card-body d-flex justify-content-center align-items-center flex-column">
                    <div>
                        <img src="{% static 'assets/pngs/plan.png'%}" alt="plan_icon" width="100rem">
                    </div>
                    <p class="mt-1">Production</p>
                </div>
            </div>
        </a>
        <a href="{% url 'finance:finance' %}" class="col-12 col-md-4 mb-2">
            <div class="card">
                <div class="card-body d-flex justify-content-center align-items-center flex-column">
                    <div>
                        <img src="{% static 'assets/pngs/bars.png'%}" alt="plan_icon" width="100rem">
                    </div>
                    <p class="mt-1">Finance</p>
                </div>
            </div>
        </a>
        <a href="{% url 'users:users' %}" class="col-12 col-md-4 mb-2">
            <div class="card">
                <div class="card-body d-flex justify-content-center align-items-center flex-column">
                    <div>
                        <img src="{% static 'assets/pngs/users.png'%}" alt="plan_icon" width="100rem">
                    </div>
                    <p class="mt-1">Users</p>
                </div>
            </div>
        </a>
        <a href="{% url 'settings:settings' %}" class="col-12 col-md-4 mb-2">
            <div class="card">
                <div class="card-body d-flex justify-content-center align-items-center flex-column">
                    <div>
                        <img src="{% static 'assets/pngs/settings.png'%}" alt="plan_icon" width="100rem">
                    </div>
                    <p class="mt-1">Settings</p>
                </div>
            </div>
        </a>
        <a href="{% url 'inventory:end_of_day_list' %}" class="col-12 col-md-4 mb-2">
            <div class="card">
                <div class="card-body d-flex justify-content-center align-items-center flex-column">
                    <div>
                        <img src="{% static 'assets/pngs/reports.jpg'%}" alt="plan_icon" width="100rem">
                    </div>
                    <p class="mt-1">End Of Day List</p>
                </div>
            </div>
        </a>
    </div>
</div>

<script>
    const socket = new WebSocket('ws://' + window.location.host + '/ws/sales/');

    socket.onopen = function() {
        console.log('WebSocket connection established');
    };

    socket.onerror = function(error) {
        console.error('WebSocket error:', error);
    };

    socket.onmessage = function(e) {
        const message = JSON.parse(e.data);
        console.log(message['data'], 'web socket data');
        
        const totalSalesElement = document.getElementById('total-sales');
        if (totalSalesElement) {
            totalSalesElement.innerText = `$${message['data']['total_sales']}`;
        }
    };
</script>
{% endblock content %}
