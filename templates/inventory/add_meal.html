{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="mt-4">
  <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
    <div class="d-flex align-items-center">
      <a href="{% url 'inventory:meal_list' %}" class="btn btn-outline-secondary me-2">
        <i class="bx bx-arrow-back"></i>
      </a>
      <a href="/" class="btn btn-outline-secondary me-3">
        <i class="bx bx-home"></i>
      </a>
      <h5 class="mb-0">Create Meal</h5>
    </div>
    <div>
      <a href="{% url 'inventory:meal_list' %}" class="btn btn-outline-primary">Meals</a>
    </div>
  </div>

  <form method="post" class="p-2">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6">
        <label for="id_name" class="form-label">Meal Name <span class="text-danger">*</span></label>
        <input type="text" name="name" maxlength="255" class="form-control" required id="id_name" placeholder="Enter meal name">
      </div>

      <div class="col-md-6">
        <label for="id_price" class="form-label">Price ($)<span class="text-danger">*</span></label>
        <input type="number" step="0.01" name="price" class="form-control" required id="id_price" placeholder="Enter price">
      </div>

      <div class="col-md-6">
        <label for="id_category" class="form-label">Category <span class="text-danger">*</span></label>
        <div class="input-group">
          <select name="category" class="form-select" required id="id_category">
            <option value="" selected disabled>---------</option>
            {% for category in meal_categories %}
            <option value="{{ category.id }}">{{ category }}</option>
            {% endfor %}
          </select>
          <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
            <i class="bx bx-plus"></i>
          </button>
        </div>
      </div>

      <div class="col-md-6">
        <label for="id_dish" class="form-label">Dishes <span class="text-danger">*</span></label>
        <select name="dish" class="form-select" required id="id_dish" multiple>
          {% for dish in dishes %}
          <option value="{{ dish.id }}">{{ dish.name }} ({{ dish.cost }})</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="mt-4">
      <h5 class="border-bottom pb-2 mb-3">Supplies</h5>
      <div class="row g-3 align-items-end">
        <div class="col-md-6">
          <label for="id_supply_item" class="form-label">Supply Item</label>
          <select id="id_supply_item" class="form-select">
            <option value="">Select Supply</option>
            {% for product in packaging_products %}
            <option value="{{ product.id }}">{{ product.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label for="id_supply_quantity" class="form-label">Quantity</label>
          <input type="number" id="id_supply_quantity" class="form-control" placeholder="Enter quantity">
        </div>
        <div class="col-md-2">
          <button type="button" class="btn btn-success w-100" id="add-supply-btn">
            <i class="bx bx-plus"></i> Add
          </button>
        </div>
      </div>

      <div class="table-responsive mt-3">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-light">
            <tr>
              <th>Supply Item</th>
              <th>Quantity</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="supply-cart">
            <tr>
              <td colspan="3" class="text-center text-muted">No supplies added yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-4">
      <button type="reset" class="btn btn-outline-secondary me-2">
        <i class="bx bx-reset"></i> Reset
      </button>
      <button type="submit" class="btn btn-primary">
        <i class="bx bx-save"></i> Save Meal
      </button>
    </div>
  </form>

  <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-labelledby="addCategoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addCategoryModalLabel">Add New Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="categoryForm">
            {% csrf_token %}
            <div class="mb-3">
              <label for="categoryName" class="form-label">Category Name</label>
              <input type="text" class="form-control" id="categoryName" placeholder="Enter category name" required>
            </div>
            <div class="d-flex justify-content-end">
              <button type="button" id="categorySubmitBtn" class="btn btn-primary">
                <i class="bx bx-save"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  new SlimSelect({
    select: '#id_dish',
    placeholder: 'Select Dishes'
  });

  let supplies = [];

  document.getElementById('add-supply-btn').addEventListener('click', function () {
    const supplyItem = document.getElementById('id_supply_item');
    const quantity = parseFloat(document.getElementById('id_supply_quantity').value);

    if (!supplyItem.value || !quantity || quantity <= 0) {
      Swal.fire("Error", "Please select a supply item and enter a valid quantity.", "error");
      return;
    }

    supplies.push({
      id: supplyItem.value,
      name: supplyItem.options[supplyItem.selectedIndex].text,
      quantity: quantity
    });

    updateSupplyTable();

    supplyItem.value = "";
    document.getElementById('id_supply_quantity').value = "";
  });

  function updateSupplyTable() {
    const tableBody = document.getElementById('supply-cart');
    tableBody.innerHTML = "";

    if (supplies.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">No supplies added yet.</td></tr>`;
      return;
    }

    supplies.forEach((supply, index) => {
      tableBody.innerHTML += `
        <tr>
          <td>${supply.name}</td>
          <td>${supply.quantity}</td>
          <td>
            <button type="button" class="btn btn-sm btn-danger" onclick="removeSupply(${index})">
              <i class="bx bx-trash"></i>
            </button>
          </td>
        </tr>
      `;
    });
  }

  function removeSupply(index) {
    supplies.splice(index, 1);
    updateSupplyTable();
  }


  document.querySelector('form').addEventListener('submit', function (e) {
    e.preventDefault();

    const form = this;
    const hiddenSupplies = document.createElement('input');
    hiddenSupplies.type = 'hidden';
    hiddenSupplies.name = 'supplies_data';
    hiddenSupplies.value = JSON.stringify(supplies);  
    form.appendChild(hiddenSupplies);

    form.submit();  
  });

  document.getElementById("categorySubmitBtn").addEventListener('click', function () {
    const categoryName = document.getElementById('categoryName').value.trim();
    if (!categoryName) {
      Swal.fire("Error", "Please enter a category name.", "error");
      return;
    }

    const formData = {
      category: categoryName,
      csrfmiddlewaretoken: $('input[name="csrfmiddlewaretoken"]').val(),
    };

    fetch("{% url 'inventory:create_meal_category' %}", {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': $('input[name="csrfmiddlewaretoken"]').val()
      },
      body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        const categorySelect = document.getElementById('id_category');
        const option = document.createElement('option');
        option.value = data.id;
        option.text = data.name;
        option.selected = true;
        categorySelect.add(option);

        Swal.fire("Success", "Meal category successfully added.", "success");

        const modal = bootstrap.Modal.getInstance(document.getElementById('addCategoryModal'));
        modal.hide();
      } else {
        Swal.fire("Error", data.message, "error");
      }
    });
  });
</script>
{% endblock %}
