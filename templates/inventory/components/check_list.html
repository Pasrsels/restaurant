{% load static %}
{% block content %}
<style>
    .filter-btn.active {
        background-color: #0d6efd;
        color: #fff;
    }
</style>
<div class="">
    <div class="card shadow-sm p-3 rounded">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="mb-0 fw-bold">
                <i class="bx bx-line-chart"></i> Stock Movement
            </h6>
        </div>

        <div class="btn-group w-100 mb-3" role="group">
            <button type="button" class="btn btn-primary-sm filter-btn active" data-filter="all">All</button>
            <button type="button" class="btn btn-primary-sm filter-btn" data-filter="finished">Finished</button>
            <button type="button" class="btn btn-primary-sm filter-btn" data-filter="rawmaterial">Raw Material</button>
            <button type="button" class="btn btn-primary-sm filter-btn" data-filter="packaging">Packaging</button>
        </div>

         {% for product in products %}
                <tr>
                    <td class="d-flex align-items-center">
                        {{ product.name }}
                    </td>
                    <td class="">
                        <i class="bx bx-info-circle text-secondary ms-2 info-icon"
                            style="cursor: pointer;"
                            data-bs-toggle="modal"
                            data-bs-target="#productModal"
                            data-id="{{ product.id }}">
                        </i>
                       {% endcomment %}
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2" class="text-center text-muted">
                        No products available
                    </td>
                </tr>
                {% endfor %}
    </div>
</div>

<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="productModalLabel">Product Detail</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="product-detail-content" class="p-2">
                    <p class="text-center text-muted">Loading...</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const stockList = document.getElementById('stock-list');
    const modalBody = document.getElementById('product-detail-content');

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');

            const filterType = this.getAttribute('data-filter');

            fetch(`/inventory/filter-products/?filter=${filterType}`)
                .then(response => response.json())
                .then(data => {
                    stockList.innerHTML = '';

                    if (data.products.length === 0) {
                        stockList.innerHTML = `<li class="list-group-item text-center text-muted">No products available</li>`;
                        return;
                    }

                    data.products.forEach(product => {
                        stockList.innerHTML += `
                            <table class="table table-borderless mb-0">
                                <tbody>
                                    <tr>
                                        <td class="d-flex align-items-center">
                                            ${product.name}
                                        </td>
                                        <td class="text-end">
                                            <i class="bx bx-info-circle text-secondary ms-2 info-icon"
                                            style="cursor: pointer;"
                                            data-bs-toggle="modal"
                                            data-bs-target="#productModal"
                                            data-id="${product.id}"></i>
                                            <span class="badge bg-primary rounded-pill">
                                                ${product.quantity}
                                            </span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        `;
                    });

                    attachInfoIconListeners();
                })
                .catch(error => console.error('Error fetching filtered products:', error));
        });
    });

    function attachInfoIconListeners() {
        document.querySelectorAll('.info-icon').forEach(icon => {
            icon.addEventListener('click', function() {
                const productId = this.getAttribute('data-id');
                modalBody.innerHTML = `<p class="text-center text-muted">Loading...</p>`;

                fetch(`/inventory/stock-detail/${productId}/`)
                    .then(response => response.json())
                    .then(data => {
                        modalBody.innerHTML = `
                            <div>
                                <p><strong>Name:</strong> ${data.name}</p>
                                <p><strong>Quantity:</strong> ${data.quantity}</p>
                                <p><strong>Last Updated:</strong> ${data.last_updated}</p>
                                <p><strong>Location:</strong> ${data.location}</p>
                            </div>
                        `;
                    })
                    .catch(error => {
                        modalBody.innerHTML = `<p class="text-danger text-center">Error loading product details.</p>`;
                        console.error('Error fetching product detail:', error);
                    });
            });
        });
    }

    attachInfoIconListeners();
});
</script>

{% endblock %}
