{% load static %}
{% load crispy_forms_tags %}

<!-- DISH CREATION FORM TEMPLATE -->
<h4 style="color: #28a745; margin-bottom: 20px;">Create New Dish</h4>

<div class="row mt-2">
    <div class="col-9">
        <table class="table">
            <thead class="bg-primary">
                <th>Raw Material</th>
                <th>Quantity (kgs)</th>
                <th>Total Cost</th>
            </thead>
            <tbody id="cart-items"></tbody>
        </table>
        <div class="d-flex justify-content-end">
            <button class="btn border bx bx-reset mx-2" id="id_reset"></button>
            <button class="btn-primary btn sm bx bx-save" id="id_submit"></button>
        </div>
    </div>
    <div class="col-3 mt-2">
        <form id="dish-form">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_name" class="form-label requiredField">
                    Dish Name<span class="asteriskField">*</span>
                </label>
                <input type="text" name="name" class="textinput form-control" required="" id="id_name">
            </div>
            <div class="mb-3">
                <label for="id_price" class="form-label requiredField">
                    Selling Price<span class="asteriskField">*</span>
                </label>
                <input type="number" name="price" step="0.01" class="numberinput form-control" required="" id="id_price">
            </div>
            <div class="mb-3">
                <label for="id_portion_multiplier" class="form-label requiredField">
                    Portion Multiplier<span class="asteriskField">*</span>
                </label>
                <input type="number" name="portion_multiplier" step="0.01" class="numberinput form-control" required="" id="id_portion_multiplier">
            </div>
            <div class="mb-3">
                <label for="id_category" class="form-label requiredField">
                    Category<span class="asteriskField">*</span>
                </label>
                <select name="category" class="select form-select" required="" id="id_category">
                    <option value="">---------</option>
                    <option value="Fast food">Fast food</option>
                    <option value="Meat">Meat</option>
                    <option value="Starch">Starch</option>
                    <option value="Salad">Salad</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="id_raw_material" class="form-label requiredField">
                    Raw Material<span class="asteriskField">*</span>
                </label>
                <select name="raw_material" required="" id="id_raw_material" class='form-control'>
                    <option value="">---------</option>
                    {% for r in r_m %}
                        <option value="{{ r.id}}">{{ r.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="id_quantity" class="form-label requiredField">
                    Quantity <span id='unit'></span><span class="asteriskField">*</span>
                </label>
                <input type="number" name="quantity" step="any" class="numberinput form-control" required="" id="id_quantity">
            </div>
            <div class="mb-3">
                <label for="id_note" class="form-label requiredField">
                    Note<span class="asteriskField">*</span>
                </label>
                <input type="text" name="note" maxlength="100" class="textinput form-control" required="" id="id_note">
            </div>
            <button type="button" id="save-button" class="btn btn-secondary btn-sm w-100">Save</button>
        </form>
    </div>
</div>

<script>
    console.log('Dish creation form template loaded successfully!');
    
    // Function to initialize the dish creation form
    function initializeDishCreationForm() {
        console.log('Initializing dish creation form...');
        let cart = [];
        let product = '';
        let unit_cost = 1;
        let productCost = 0.00
        let unit_of_measurement = ''
        let rawMaterialData = []
        let portionMultiplier = 0
        let dish_total = 0

        // Initialize Select2 for raw material
        if ($.fn.select2) {
            $('#id_raw_material').select2();
            console.log('Select2 initialized for raw material');
        } else {
            console.error('Select2 not available');
        }

        $('#id_raw_material').on('change', function(e){
            product = e.target.value;
        });

        $('#id_reset').on('click', function(){
          cart = []
          updateCartTable()
        })

        $('#id_raw_material').on('change', function(e) {
            const selectedProductId = e.target.value;
            const postData = {
                csrfmiddlewaretoken: $('input[name="csrfmiddlewaretoken"]').val(),
                raw_material_id: selectedProductId,
            };

            fetch('{% url "inventory:raw_material_json" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': $('input[name="csrfmiddlewaretoken"]').val()
                },
                body: JSON.stringify(postData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success){
                    console.log(data.data)
                    productCost = parseFloat(data.data[0].cost)
                    rawMaterialData.push(data.data)   
                    document.getElementById('unit').textContent=`(${data.data[0].unit__unit_name})`                                                                        
                } else {
                    Swal.fire({
                        title: "Error",
                        text: data.message,
                        icon: "error"
                    });
                }
            })
            .catch(error => {
                console.error('Error posting product data:', error);
            });
        });

        $('#id_submit').on('click', function(){
            
          const postData = {
            csrfmiddlewaretoken: $('input[name="csrfmiddlewaretoken"]').val(),
            cart: cart,
            dish_cost: dish_total,
            name: document.getElementById('id_name').value,
            selling_price: parseFloat(document.getElementById('id_price').value),
            portion_multiplier: parseFloat(document.getElementById('id_portion_multiplier').value),
            category: document.getElementById('id_category').value
        };
        
        fetch('{% url "inventory:add_dish_ajax" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': $('input[name="csrfmiddlewaretoken"]').val()
            },
            body: JSON.stringify(postData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                Swal.fire({
                    title: "Success",
                    text: "Dish created successfully!",
                    icon: "success"
                }).then(() => {
                    cart = [];
                    updateCartTable();
                    loadPage('{% url "inventory:dish_list_ajax" %}');
                });
            }else {
                Swal.fire({
                    title: "Error",
                    text: data.message,
                    icon: "error"
                });
            }
        })
        .catch(error => {
            console.error('Error submitting production plan:', error);
        });
        })

        $('#save-button').on('click', function() {
            let totalProductCost = 0
            let quantity = parseFloat(document.getElementById('id_quantity').value)
            portionMultiplier = parseFloat(document.getElementById('id_portion_multiplier').value)

            if(!portionMultiplier){
                Swal.fire({
                    title: "Error",
                    text: 'Please specify portion multiplier value.',
                    icon: "error"
                });
                return;
            }

            if(!quantity){
                Swal.fire({
                    title: "Error",
                    text: 'Quantity cant be empty!',
                    icon: "error"
                });
                return;
            }

            totalProductCost =  totalCost(quantity, productCost, portionMultiplier)

            const item = {
                note: document.getElementById('id_note').value,
                raw_material: $('#id_raw_material option:selected').text(),
                quantity: quantity,
                cost: totalProductCost.toFixed(3),
            };

            cart.push(item);
            console.log(cart)
            updateCartTable();
        });

        function totalCost(quantity, productCost, portionMultiplier){
            return (quantity * productCost) / portionMultiplier
        }

        function updateCartTable() {
            let total = 0
            const cartItems = $('#cart-items');
            cartItems.empty();
            cart.forEach((item, index) => {
                cartItems.append(
                    `
                        <tr>
                            <td>
                                <button class="btn border bx bx-trash" onclick="deleteItem(${index})"></button>
                                <span class='mx-2'>${item.raw_material}</span>
                            </td>
                            <td>
                                <input type="number" class="form-control" value="${item.quantity}" onchange="updateQuantity(${index}, this.value)">
                            </td>
                            <td>${item.cost}</td>
                        </tr>
                    `
                );
                total += parseFloat(item.cost)
            });

            dish_total = total;
        }

        window.deleteItem = function(index) {
            cart.splice(index, 1);
            updateCartTable();
        }

        window.updateQuantity = function(index, newQuantity) {
            const item = cart[index];
            item.quantity = parseFloat(newQuantity);
            item.cost = totalCost(newQuantity, productCost, portionMultiplier)
            updateCartTable();
        }
    }
    
    // Initialize when document is ready
    $(document).ready(function() {
        initializeDishCreationForm();
    });
</script>
