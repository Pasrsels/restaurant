<style>
    .filter-btn.active {
        background-color: #0d6efd;
        color: #fff;
    }
    /* Thin primary scrollbar */
    .stock-scroll {
        scrollbar-width: thin;
        scrollbar-color: #0d6efd transparent;
    }
    .stock-scroll::-webkit-scrollbar {
        width: 6px;
    }
    .stock-scroll::-webkit-scrollbar-track {
        background: transparent;
    }
    .stock-scroll::-webkit-scrollbar-thumb {
        background-color: #0d6efd;
        border-radius: 4px;
    }
    /* Right-align last cell */
    #stock-list td:last-child {
        text-align: right;
    }
</style>
<div style="width:100%">
    <div class="card border-0 shadow-sm w-100 p-3 rounded" style='height:100vh;'>
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 class="mb-0">
                <i class="bx bx-line-chart"></i> Inventory
            </h4>
        </div>

        <div class="mb-3 d-flex justify-content-between align-items-center gap-1 p-2 flex-column" role="group">
            <div class="btn-group" role="group" aria-label="Type filters">
                <button type="button" class="btn btn-primary-sm filter-btn active" data-filter="all">All</button>
                <button type="button" class="btn btn-primary-sm filter-btn" data-filter="finished">Finished</button>
                <button type="button" class="btn btn-primary-sm filter-btn" data-filter="rawmaterial">RM</button>
                <!-- <button type="button" class="btn btn-primary-sm filter-btn" data-filter="packaging">Packaging</button> -->
            </div>
            <div class="d-flex align-items-center ms-2">
                <label for="location-select" class="me-2 mb-0 small text-muted">Location</label>
                <select id="location-select" class="form-select form-select-sm" style="min-width: 140px;">
                    <option value="all" selected>All</option>
                    <option value="kitchen">Kitchen</option>
                    <option value="warehouse">Warehouse</option>
                </select>
            </div>
        </div>

        <div class="stock-scroll" style="height: 100vh; overflow-y: auto;">
            <table class="table table-borderless mb-0 w-100">
                <tbody id="stock-list">
                    {% for product in products %}
                    <tr>
                        <td class="d-flex align-items-center">
                            {{ product.name }}
                        </td>
                        <td>
                            <i class="bx bx-info-circle text-secondary ms-2 activity-log-btn"
                               style="cursor: pointer;"
                               data-source="inventory"
                               data-product-id="{{ product.id }}">
                            </i>
                        </td>
                        <td class="text-end">
                            <span class="">{{ product.quantity|floatformat:2 }}</span>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="2" class="text-center text-muted">
                            No products available
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const stockList = document.getElementById('stock-list');

    const locationSelect = document.getElementById('location-select');

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');

            const filterType = this.getAttribute('data-filter');
            const location = locationSelect ? locationSelect.value : 'all';

            fetch(`{% url "inventory:filter_products" %}?filter=${filterType}&location=${location}`)
                .then(response => response.json())
                .then(data => {
                    stockList.innerHTML = '';
                    if (data.products.length === 0) {
                        stockList.innerHTML = `<tr><td colspan="2" class="text-center text-muted">No products available</td></tr>`;
                        return;
                    }
                    data.products.forEach(product => {
                        stockList.innerHTML += `
                            <tr>
                                <td class="d-flex align-items-center">
                                    ${product.name}
                                </td>
                                <td>
                                    <i class="bx bx-info-circle text-secondary ms-2 info-icon"
                                        style="cursor: pointer;"
                                        data-bs-toggle="modal"
                                        data-bs-target="#productModal"
                                        data-id="${product.id}"></i>
                                </td>
                                <td class="text-end">
                                    <span class="">${product.quantity}</span>
                                </td>
                            </tr>
                        `;
                    });
                    attachInfoIconListeners();
                })
                .catch(error => console.error('Error fetching filtered products:', error));
        });
    });

    if (locationSelect) {
        locationSelect.addEventListener('change', () => {
            const activeBtn = document.querySelector('.filter-btn.active');
            const filterType = activeBtn ? activeBtn.getAttribute('data-filter') : 'all';
            run(filterType);
        });
    }

    function run(filterType='all'){
        const location = locationSelect ? locationSelect.value : 'all';
        fetch(`{% url "inventory:filter_products" %}?filter=${filterType}&location=${location}`)
            .then(response => response.json())
            .then(data => {
                console.log(data)
                stockList.innerHTML = '';
                if (data.products.length === 0) {
                    stockList.innerHTML = `<tr><td colspan="2" class="text-center text-muted">No products available</td></tr>`;
                    return;
                }
                data.products.forEach(product => {
                    stockList.innerHTML += `
                        <tr>
                            <td class="d-flex align-items-center">
                                ${product.name}
                            </td>
                            <td>
                                <i class="bx bx-info-circle text-secondary ms-2 info-icon"
                                    style="cursor: pointer;"
                                    data-bs-toggle="modal"
                                    data-bs-target="#productModal"
                                    data-id="${product.id}"></i>
                            </td>
                            <td class="text-end">
                                <span class="">${product.quantity}</span>
                            </td>
                        </tr>
                    `;
                });
                attachInfoIconListeners();
            })
            .catch(error => console.error('Error fetching filtered products:', error));
    }

    run();

    function attachInfoIconListeners() {
        // to fill 
    }

    attachInfoIconListeners();
});
</script>
