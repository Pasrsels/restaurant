{% extends "base.html" %}
{% block content %}

<h2>Production Plans</h2>
<div id="production-list">
    {% include "production/_production_list_items.html" %}
</div>

<div id="loading" style="display:none;">Loading...</div>

{% endblock %}

<script>
let page = 2;  
let loading = false;
let hasNext = true;

window.addEventListener('scroll', () => {
    if (!loading && hasNext && (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 200) {
        loadMore();
    }
});

function loadMore() {
    loading = true;
    document.getElementById('loading').style.display = 'block';

    fetch(`?page=${page}`, {headers: {'X-Requested-With': 'XMLHttpRequest'}})
        .then(res => res.json())
        .then(data => {
            document.getElementById('production-list').insertAdjacentHTML('beforeend', data.productions_html);
            hasNext = data.has_next;
            page++;
            loading = false;
            document.getElementById('loading').style.display = 'none';
        });
}
</script>
