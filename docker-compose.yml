version: "3.9"

services:
  web:
    build: .
    command: gunicorn restaurant.wsgi:application --bind 0.0.0.0:8300
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    ports:
      - "8300:8300"
    depends_on:
      - redis
      - db
    restart: always

  redis:
    image: redis:6.2-alpine
    ports:
      - "6380:6379"
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web
    restart: always

  db:
    image: postgres:16
    container_name: restaurant-postgres
    environment:
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: restaurant_pass
      POSTGRES_DB: restaurant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

volumes:
  static_volume:
  media_volume:
  postgres_data:
